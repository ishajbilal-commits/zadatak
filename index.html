<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>Zadatak — Coming Soon</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17241f;
      background: #f5f7f2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 0%, #e4f0e8 0, #f5f7f2 58%);
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 8vw, 5rem);
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #e1e8e0;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(32, 62, 46, 0.08);
    }

    .brand {
      margin: 0 0 2.5rem;
      color: #26734d;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 0.8rem;
      color: #628071;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 5rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .message {
      max-width: 38ch;
      margin: 1.25rem auto 0;
      color: #596a61;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .accent {
      width: 48px;
      height: 4px;
      margin: 2rem auto 0;
      border-radius: 999px;
      background: #46a16c;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Zadatak</p>
    <p class="eyebrow">A new beginning</p>
    <h1>Coming Soon</h1>
    <p class="message">We’re working on something useful. Check back soon to see what’s next for Zadatak.</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
